name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m dirtydata_lab generate --rows 100 --seed 42 --output output
      - run: python -m dirtydata_lab detect --input output/dirty.csv --contract output/contract.json --output output/predictions.json
      - run: python -m dirtydata_lab evaluate --truth output/ground_truth.json --predictions output/predictions.json --output output/evaluation.json
